<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HTML and CSS Quiz</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
    <main>
        <h1>HTML and CSS Quiz</h1>
        <p class="intro">Answer the four questions below, then select Submit Quiz.</p>

        <form action="#" method="post">

            <div class="question">
                <label for="q1">1. Fill in the blank: The HTML element used to create the largest heading on a page is the &lt;___&gt; element.</label>
                <input type="text" id="q1" name="q1">
            </div>

            <div class="question">
                <label for="q2">2. In your own words, explain the difference between margin and padding in CSS.</label>
                <textarea id="q2" name="q2" rows="5"></textarea>
            </div>

            <div class="question">
                <label for="q3">3. Which CSS selector targets an element with the ID "main-nav"?</label>
                <select id="q3" name="q3">
                    <option value="" selected disabled>Choose One ...</option>
                    <option value="class-selector">.main-nav</option>
                    <option value="id-selector">#main-nav</option>
                    <option value="element-selector">main-nav</option>
                    <option value="child-selector">&gt; main-nav</option>
                </select>
            </div>

            <div class="question">
                <label for="q4">4. How many columns does a table row have if it contains three &lt;td&gt; elements and none use colspan?</label>
                <input type="number" id="q4" name="q4" min="0" step="1">
            </div>

            <button type="submit">Submit Quiz</button>

        </form>
    </main>
</body>

</html>
